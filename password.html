<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Class Marks Portal - Class ID</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23ea580c'/><circle cx='50' cy='50' r='22.5' fill='black'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="selection-page">


        <!-- TITLE -->

        <section class="selection-title-section">

            <div class="portal-badge">

                <span></span>

                Anonymous Class Portal

            </div>


            <h1 class="selection-title">

                Class Marks Portal

            </h1>


            <p class="selection-subtitle">

                Enter your class ID to continue.

            </p>

        </section>



        <!-- CLASS ID INPUT -->

        <section class="selection-subject-section">

            <div class="selection-content">

                <label for="class-id">
                    Class ID
                </label>


                <div class="input-wrapper">

                    <input
                        type="text"
                        id="class-id"
                        placeholder="Enter class ID"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                    >

                </div>


                <p
                    id="gate-error"
                    class="error-message hidden"
                >
                    Incorrect class ID.
                </p>

            </div>

        </section>



        <!-- EMPTY (keeps the page layout identical to the next page) -->

        <section class="selection-exam-section"></section>



        <!-- BUTTON + PRIVACY -->

        <section class="selection-continue-section">

            <button
                id="gate-btn"
                class="continue-button"
            >
                Continue
            </button>


            <div class="privacy-box">

                <div class="privacy-icon">
                    🔒
                </div>


                <div>

                    <p>
                        Your submission is anonymous
                    </p>

                    <span>
                        The class ID only unlocks the portal. It is not linked to your marks.
                    </span>

                </div>

            </div>

        </section>


    </main>


    <script src="script.js"></script>


    <script>

        /* =========================
           PASSWORD (write it in lowercase)
           ========================= */

        const PASSWORD = "prp115";


        const input = document.getElementById("class-id");
        const button = document.getElementById("gate-btn");
        const error = document.getElementById("gate-error");


        /* opening this page always asks for the password again */
        sessionStorage.removeItem("access");


        function checkPassword() {

            const entered = input.value.trim().toLowerCase();

            if (entered === PASSWORD) {

                sessionStorage.setItem("access", "granted");
                window.location.href = "index.html";

            } else {

                error.textContent = "Incorrect class ID.";
                error.classList.remove("hidden");

            }

        }


        button.addEventListener("click", checkPassword);

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                checkPassword();
            }
        });

    </script>

</body>

</html>
